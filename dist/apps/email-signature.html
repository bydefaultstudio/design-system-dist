
      <!--
        A tool on the shared canvas, built from docks (cms/tool-canvas.md,
        Docks), in the Side panels layout: the bar, the rendered signature in
        the preview, the controls docked on the right in three sections —
        Details, Links and Export — and the one verb pinned at the dock's
        foot. The toggle in the preview's corner folds the dock away so the
        signature takes the canvas. No footer and no page header: the canvas
        is the page, and which client each format is for is said in Export.

        The bar names the tool. Copy link and Reset all are permanent
        residents of the overflow menu (data-priority="menu"), so the trailing
        cluster is the menu and the close. The exit is last: build-time
        contract.

        The sections follow the tools' shared model with the tool's own
        sections first: the person's details, then the links the signature
        carries, are the content, in two sections because the first is three
        fields that always apply and the second is four switches. There is no
        Style: the signature is the brand's. What you get — the rendered
        signature for Gmail and Apple Mail, or the source for Outlook, which
        installs a signature from an HTML file — is Export, and the one verb
        copies whichever is chosen. The preview follows the format, so what
        is showing is what the copy gives. The format used to be a view in
        the bar, with the copy button beside it.
      -->
      <div class="tool-canvas" id="email-signature">

        <div class="bar" data-sticky="true">
          <div class="bar-container">
            <div class="bar-content">
              <h1 class="tool-canvas-title" data-priority="pinned">Email Signature</h1>

              <div class="bar-group" data-priority="menu">
                <button type="button" class="dropdown-item js-copy-url">{{icon:link}}<span>Copy link</span></button>
              </div>
              <div class="bar-group" data-priority="menu">
                <button type="button" class="dropdown-item" id="email-signature-reset">{{icon:refresh}}<span>Reset all</span></button>
              </div>
              <!-- Feedback: opens the shared dialog (cms/chrome/feedback-dialog.html) -->
              <div class="bar-group" data-priority="menu">
                <button type="button" class="dropdown-item" data-feedback-open="share">{{icon:chat}}<span>Share feedback</span></button>
              </div>
              <div class="bar-group" data-priority="menu">
                <button type="button" class="dropdown-item" data-feedback-open="problem">{{icon:warning}}<span>Report a problem</span></button>
              </div>
            </div><!-- /.bar-content -->
            <div class="bar-actions">
              <div class="dropdown bar-overflow" hidden>
                <button class="dropdown-trigger" type="button" aria-expanded="false" aria-label="More controls">{{icon:ellipsis-large}}</button>
                <div class="dropdown-menu is-right"></div>
              </div>
              <a class="bar-close" data-page-close aria-label="Back to Tools">{{icon:close-large}}</a>
            </div>
          </div>
        </div>

        <!-- The preview is the signature as a mail client will show it, or
             its source while HTML is the format. Both scroll inside the band
             rather than growing it. The one status region is here, clipped,
             so the dock folding away never takes it out of the tree. -->
        <div class="tool-preview" data-size="tall" id="email-signature-preview">
          <div class="tool-document" id="email-signature-rendered"></div>
          <textarea id="email-signature-source" class="tool-source tool-code is-hidden" aria-label="Signature HTML" readonly></textarea>
          <p class="visually-hidden" role="status" id="email-signature-status"></p>

          <!-- Folds the dock away (tool-canvas.js), and the preview takes its
               width. The name stays "Controls"; aria-expanded carries the
               state. Last in the preview, in the bottom-right corner;
               data-edge points the icon at the dock. -->
          <button class="button tool-dock-toggle" data-variant="transparent" data-icon-only data-edge="end" type="button" aria-controls="email-signature-dock" aria-expanded="true" aria-label="Controls">
            {{icon:sidebar-right-close}}{{icon:sidebar-right-open}}
          </button>
        </div>

        <!-- The sections scroll as one column (tool-canvas.js adds the tab
             stop while it overflows), and the verb sits under them. Every
             section starts open. Details first: a phone meets the fields
             before the links and the format. -->
        <div class="tool-dock" data-edge="end" id="email-signature-dock">
          <div class="tool-panels accordion" data-accordion="multi" id="email-signature-panels" role="group" aria-label="Email Signature controls">

          <!-- No reset: the details are the reader's work. Reset all in the
               bar's menu clears them. -->
          <div class="tool-panel accordion-item is-open">
            <div class="tool-panel-header">
              <h2 class="tool-panel-heading">
                <button type="button" class="accordion-header" id="email-signature-details-heading" aria-expanded="true" aria-controls="email-signature-details-section">
                  <span class="tool-panel-title">Details</span>{{icon:chevron-down}}
                </button>
              </h2>
            </div>
            <div class="accordion-content" id="email-signature-details-section" role="region" aria-labelledby="email-signature-details-heading">
            <div class="accordion-inner">
            <div class="tool-panel-body">

              <div class="block gap-s">
                <label data-variant="caption" for="email-signature-name">Name</label>
                <input type="text" id="email-signature-name" placeholder="Jane Doe" autocomplete="name">
              </div>
              <div class="block gap-s">
                <label data-variant="caption" for="email-signature-role">Role</label>
                <input type="text" id="email-signature-role" placeholder="Creative Director" autocomplete="organization-title">
              </div>
              <div class="block gap-s">
                <label data-variant="caption" for="email-signature-email">Email</label>
                <input type="email" id="email-signature-email" placeholder="jane@{{brand:websiteHost}}" autocomplete="email" aria-describedby="email-signature-email-error">
                <p class="form-error" id="email-signature-email-error" role="alert"></p>
              </div>

            </div>
            </div>
            </div>
          </div>

          <!-- Each link is a switch with its field under it; the switch is the
               row's visible name — "Show" hidden in front of it, so the
               switch names an action — and the field carries its own name
               for assistive technology (the hidden-label pattern,
               cms/form.md). A field tagged data-opt shows and hides with its
               switch; the association is adjacency, and the next Tab lands
               in the field just revealed. -->
          <div class="tool-panel accordion-item is-open">
            <div class="tool-panel-header">
              <h2 class="tool-panel-heading">
                <button type="button" class="accordion-header" id="email-signature-links-heading" aria-expanded="true" aria-controls="email-signature-links-section">
                  <span class="tool-panel-title">Links</span>{{icon:chevron-down}}
                </button>
              </h2>
              <!-- Puts the four switches back to their defaults. What was
                   typed into the fields is the reader's work and stays. -->
              <button class="button tool-panel-action" data-variant="transparent" data-icon-only type="button" id="email-signature-links-reset" data-reset="links" aria-label="Reset Links" data-tooltip="Reset Links" data-tooltip-position="left" disabled>{{icon:refresh}}</button>
            </div>
            <div class="accordion-content" id="email-signature-links-section" role="region" aria-labelledby="email-signature-links-heading">
            <div class="accordion-inner">
            <div class="tool-panel-body">

              <div class="block gap-s">
                <div class="form-toggle" data-variant="mono">
                  <input type="checkbox" role="switch" id="email-signature-website-toggle" checked>
                  <label for="email-signature-website-toggle"><span class="visually-hidden">Show </span>Website</label>
                </div>
                <div class="block gap-s" data-opt="website" id="email-signature-website-field">
                  <input type="text" id="email-signature-website" value="{{brand:websiteHost}}" placeholder="{{brand:websiteHost}}" autocomplete="url" aria-label="Website address" aria-describedby="email-signature-website-error">
                  <p class="form-error" id="email-signature-website-error" role="alert"></p>
                </div>
              </div>
              <div class="block gap-s">
                <div class="form-toggle" data-variant="mono">
                  <input type="checkbox" role="switch" id="email-signature-linkedin-toggle">
                  <label for="email-signature-linkedin-toggle"><span class="visually-hidden">Show </span>LinkedIn</label>
                </div>
                <div class="block gap-s" data-opt="linkedin" id="email-signature-linkedin-field">
                  <div class="field">
                    <span class="field-affix" data-variant="prefix" id="email-signature-linkedin-prefix">linkedin.com/in/</span>
                    <input type="text" id="email-signature-linkedin" placeholder="janedoe" aria-label="LinkedIn username" aria-describedby="email-signature-linkedin-prefix email-signature-linkedin-error">
                  </div>
                  <p class="form-error" id="email-signature-linkedin-error" role="alert"></p>
                </div>
              </div>
              <div class="block gap-s">
                <div class="form-toggle" data-variant="mono">
                  <input type="checkbox" role="switch" id="email-signature-instagram-toggle">
                  <label for="email-signature-instagram-toggle"><span class="visually-hidden">Show </span>Instagram</label>
                </div>
                <div class="block gap-s" data-opt="instagram" id="email-signature-instagram-field">
                  <div class="field">
                    <span class="field-affix" data-variant="prefix" id="email-signature-instagram-prefix">instagram.com/</span>
                    <input type="text" id="email-signature-instagram" placeholder="{{brand:slug}}" aria-label="Instagram username" aria-describedby="email-signature-instagram-prefix email-signature-instagram-error">
                  </div>
                  <p class="form-error" id="email-signature-instagram-error" role="alert"></p>
                </div>
              </div>
              <div class="form-toggle" data-variant="mono">
                <input type="checkbox" role="switch" id="email-signature-disclaimer-toggle" checked>
                <label for="email-signature-disclaimer-toggle"><span class="visually-hidden">Show the </span>Confidentiality disclaimer</label>
              </div>

            </div>
            </div>
            </div>
          </div>

          <div class="tool-panel accordion-item is-open">
            <div class="tool-panel-header">
              <h2 class="tool-panel-heading">
                <button type="button" class="accordion-header" id="email-signature-export-heading" aria-expanded="true" aria-controls="email-signature-export-section">
                  <span class="tool-panel-title">Export</span>{{icon:chevron-down}}
                </button>
              </h2>
            </div>
            <div class="accordion-content" id="email-signature-export-section" role="region" aria-labelledby="email-signature-export-heading">
            <div class="accordion-inner">
            <div class="tool-panel-body">

              <!-- Two formats, both in view: the radio-backed faded segmented
                   control, named by its caption. The note says which client
                   each is for, since the verb names the format and the tool
                   doc is a page away. The preview shows whichever is chosen. -->
              <fieldset data-variant="bare" aria-describedby="email-signature-format-note">
                <legend data-variant="caption" id="email-signature-format-label">Export as</legend>
                <div class="segmented-control" data-variant="faded" id="email-signature-format">
                  <label class="segmented-control-option"><input type="radio" name="email-signature-format" value="preview" checked><span>Signature</span></label>
                  <label class="segmented-control-option"><input type="radio" name="email-signature-format" value="html"><span>HTML</span></label>
                </div>
                <p class="form-hint" id="email-signature-format-note">Signature pastes into Gmail and Apple Mail with its formatting. HTML is the source Outlook installs from a file.</p>
              </fieldset>

            </div>
            </div>
            </div>
          </div>

          </div>

          <!--
            The verb, pinned at the dock's foot, naming the format it copies.
            The format word is a span the script rewrites inside the button's
            own text, so the name follows it with no aria-label to override
            the Copied! swap. Its own click handler in email-signature.js, not
            the shared copy-button.js one: the rich copy writes text/html.
          -->
          <div class="tool-actions">
            <div class="button-group">
              <button type="button" class="button copy-btn" id="email-signature-copy">
                <span class="copy-btn-default">{{icon:copy}}<span>Copy <span id="email-signature-copy-format">signature</span></span></span>
                <span class="copy-btn-copied">{{icon:check}}<span>Copied!</span></span>
              </button>
            </div>
          </div>
        </div>

      </div>
