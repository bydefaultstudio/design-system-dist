
      <!--
        A tool on the shared canvas, built from docks (cms/tool-canvas.md,
        Docks), in the Side panels layout: the bar, the served image in the
        preview, the controls docked on the right in three sections —
        Settings, Style and Export — and the two verbs pinned at the dock's
        foot. The toggle in the preview's corner folds the dock away so the
        image takes the canvas. No footer and no page header: the canvas is
        the page, and the URL has a home in Export.

        The bar names the tool. Copy link and Reset all are permanent
        residents of the overflow menu (data-priority="menu"), so the trailing
        cluster is the menu and the close. The exit is last: build-time
        contract.

        The sections are the tools' shared three. What the image is — its
        size, whether it carries the logo, its text — is Settings: the size
        stays here and not in Export because it IS the composition, not a
        scale the file is written at (cms/tool-canvas.md, The export panel).
        How it looks — the two colours — is Style. What you get — the URL —
        is Export, and the verbs copy it and open it.

        The size used to be a pair of fields in the bar, and logo, text and
        colour three switches that revealed a band under it. Each now lives
        in the section it belongs to: an empty text field means no text, and
        Background's None means a transparent image. The preset chips are
        built by the script from the brand tokens, so no brand colour name is
        authored into this file.
      -->
      <div class="tool-canvas" id="image-placeholder">

        <div class="bar" data-sticky="true">
          <div class="bar-container">
            <div class="bar-content">
              <h1 class="tool-canvas-title" data-priority="pinned">Image Placeholder</h1>

              <div class="bar-group" data-priority="menu">
                <button type="button" class="dropdown-item js-copy-url">{{icon:link}}<span>Copy link</span></button>
              </div>
              <div class="bar-group" data-priority="menu">
                <button type="button" class="dropdown-item" id="image-placeholder-reset">{{icon:refresh}}<span>Reset all</span></button>
              </div>
              <!-- Feedback: opens the shared dialog (cms/chrome/feedback-dialog.html) -->
              <div class="bar-group" data-priority="menu">
                <button type="button" class="dropdown-item" data-feedback-open="share">{{icon:chat}}<span>Share feedback</span></button>
              </div>
              <div class="bar-group" data-priority="menu">
                <button type="button" class="dropdown-item" data-feedback-open="problem">{{icon:warning}}<span>Report a problem</span></button>
              </div>
            </div><!-- /.bar-content -->
            <div class="bar-actions">
              <div class="dropdown bar-overflow" hidden>
                <button class="dropdown-trigger" type="button" aria-expanded="false" aria-label="More controls">{{icon:ellipsis-large}}</button>
                <div class="dropdown-menu is-right"></div>
              </div>
              <a class="bar-close" data-page-close aria-label="Back to Tools">{{icon:close-large}}</a>
            </div>
          </div>
        </div>

        <!-- The preview is the real endpoint: it IS the served image. The
             route lives in the Worker, so this renders under npm run dev and
             in production, not under Live Server (CLAUDE.md §8). On the
             checkerboard so a placeholder built with a transparent background
             shows what it actually is. The one status region is here, clipped,
             so the dock folding away never takes it out of the tree. -->
        <div class="tool-preview" data-size="tall" data-ground="checker" id="image-placeholder-preview">
          <img id="image-placeholder-image" src="/image/600x400" alt="Placeholder, 600 × 400, logo only">
          <p class="visually-hidden" role="status" id="image-placeholder-status"></p>

          <!-- Folds the dock away (tool-canvas.js), and the preview takes its
               width. The name stays "Controls"; aria-expanded carries the
               state. Last in the preview, in the bottom-right corner;
               data-edge points the icon at the dock. -->
          <button class="button tool-dock-toggle" data-variant="transparent" data-icon-only data-edge="end" type="button" aria-controls="image-placeholder-dock" aria-expanded="true" aria-label="Controls">
            {{icon:sidebar-right-close}}{{icon:sidebar-right-open}}
          </button>
        </div>

        <!-- The sections scroll as one column (tool-canvas.js adds the tab
             stop while it overflows), and the verbs sit under them. Every
             section starts open. Settings first: a phone meets the size and
             the content before the colours and the URL. -->
        <div class="tool-dock" data-edge="end" id="image-placeholder-dock">
          <div class="tool-panels accordion" data-accordion="multi" id="image-placeholder-panels" role="group" aria-label="Image Placeholder controls">

          <div class="tool-panel accordion-item is-open">
            <div class="tool-panel-header">
              <h2 class="tool-panel-heading">
                <button type="button" class="accordion-header" id="image-placeholder-settings-heading" aria-expanded="true" aria-controls="image-placeholder-settings-section">
                  <span class="tool-panel-title">Settings</span>{{icon:chevron-down}}
                </button>
              </h2>
              <!-- Puts the size and the logo back to their defaults. The text
                   is the reader's work and stays; Reset all in the bar's menu
                   clears it. -->
              <button class="button tool-panel-action" data-variant="transparent" data-icon-only type="button" id="image-placeholder-settings-reset" data-reset="settings" aria-label="Reset Settings" data-tooltip="Reset Settings" data-tooltip-position="left" disabled>{{icon:refresh}}</button>
            </div>
            <div class="accordion-content" id="image-placeholder-settings-section" role="region" aria-labelledby="image-placeholder-settings-heading">
            <div class="accordion-inner">
            <div class="tool-panel-body">

              <!-- Width and height, each a number field with steppers
                   (cms/number-input.md), joined by ×. They share a row while
                   both fit and wrap to two when they do not. A value outside
                   10 to 4000 is corrected when the field is left, and the
                   status line says so. -->
              <fieldset data-variant="bare">
                <legend data-variant="caption" id="image-placeholder-size-label">Size (px)</legend>
                <div class="tool-size">
                  <!-- The field names itself; the stepper group round it
                       carries no name of its own, or a screen reader hears
                       "Width in pixels" twice before the number. -->
                  <div class="number-input" role="group">
                    <button class="number-input-btn" data-number-decrement type="button" aria-label="Decrease width"><span aria-hidden="true">&minus;</span></button>
                    <input type="number" id="image-placeholder-width" value="600" min="10" max="4000" step="1" inputmode="numeric" aria-label="Width in pixels">
                    <button class="number-input-btn" data-number-increment type="button" aria-label="Increase width"><span aria-hidden="true">+</span></button>
                  </div>
                  <span class="tool-size-sep" aria-hidden="true">&times;</span>
                  <div class="number-input" role="group">
                    <button class="number-input-btn" data-number-decrement type="button" aria-label="Decrease height"><span aria-hidden="true">&minus;</span></button>
                    <input type="number" id="image-placeholder-height" value="400" min="10" max="4000" step="1" inputmode="numeric" aria-label="Height in pixels">
                    <button class="number-input-btn" data-number-increment type="button" aria-label="Increase height"><span aria-hidden="true">+</span></button>
                  </div>
                </div>
              </fieldset>

              <div class="form-toggle" data-variant="mono">
                <input type="checkbox" id="image-placeholder-logo" role="switch" checked>
                <label for="image-placeholder-logo">Logo</label>
              </div>

              <!-- An empty field puts no text on the image — the URL carries
                   no text= at all — so typing is what turns text on. (A bare
                   ?text= renders the dimensions; that is a URL feature the
                   tool no longer writes.) -->
              <div class="block gap-s">
                <label data-variant="caption" for="image-placeholder-text">Text</label>
                <input type="text" class="tool-text" id="image-placeholder-text" placeholder="Type your text here" maxlength="100" autocomplete="off" aria-describedby="image-placeholder-text-hint">
                <p class="form-hint" id="image-placeholder-text-hint">Leave it empty for no text on the image.</p>
              </div>

            </div>
            </div>
            </div>
          </div>

          <div class="tool-panel accordion-item is-open">
            <div class="tool-panel-header">
              <h2 class="tool-panel-heading">
                <button type="button" class="accordion-header" id="image-placeholder-style-heading" aria-expanded="true" aria-controls="image-placeholder-style-section">
                  <span class="tool-panel-title">Style</span>{{icon:chevron-down}}
                </button>
              </h2>
              <!-- Puts both colours back to the Default pair. -->
              <button class="button tool-panel-action" data-variant="transparent" data-icon-only type="button" id="image-placeholder-style-reset" data-reset="style" aria-label="Reset Style" data-tooltip="Reset Style" data-tooltip-position="left" disabled>{{icon:refresh}}</button>
            </div>
            <div class="accordion-content" id="image-placeholder-style-section" role="region" aria-labelledby="image-placeholder-style-heading">
            <div class="accordion-inner">
            <div class="tool-panel-body">

              <!-- The tools' one colour control (tool-colour.js; cms/tool-canvas.md,
                   Colour), built into these mounts at init: the presets as a
                   Pairs row that sets both colours, then Foreground — the
                   logo and the text — and Background, each the brand palette
                   with a picker and a hex field. Background's None is a
                   transparent image. The contrast line measures the pair. -->
              <div id="image-placeholder-pairs"></div>
              <div id="image-placeholder-fg"></div>
              <div id="image-placeholder-bg"></div>
              <p class="form-hint" id="image-placeholder-contrast"></p>

            </div>
            </div>
            </div>
          </div>

          <div class="tool-panel accordion-item is-open">
            <div class="tool-panel-header">
              <h2 class="tool-panel-heading">
                <button type="button" class="accordion-header" id="image-placeholder-export-heading" aria-expanded="true" aria-controls="image-placeholder-export-section">
                  <span class="tool-panel-title">Export</span>{{icon:chevron-down}}
                </button>
              </h2>
            </div>
            <div class="accordion-content" id="image-placeholder-export-section" role="region" aria-labelledby="image-placeholder-export-heading">
            <div class="accordion-inner">
            <div class="tool-panel-body">

              <!-- What you are about to get: the URL the image is served
                   from, the whole state in one line, rewritten on every
                   change, so not a live region. Read-only keeps it in the tab
                   order, so it can be selected from the keyboard; the verbs
                   below copy it and open it. The hint points at the guide,
                   because the URL can be written by hand too. -->
              <div class="block gap-s">
                <label data-variant="caption" for="image-placeholder-url">Image URL</label>
                <input type="text" id="image-placeholder-url" value="/image/600x400" readonly spellcheck="false" autocomplete="off" aria-describedby="image-placeholder-url-hint">
                <p class="form-hint" id="image-placeholder-url-hint">Every choice is in the URL, so it can be typed by hand too. <a href="/tools/image-placeholder-docs.html">The URL guide</a> has the schema.</p>
              </div>

            </div>
            </div>
            </div>
          </div>

          </div>

          <!--
            The verbs, pinned at the dock's foot. Copy takes the URL field's
            value through copy-button.js (data-clipboard-target); "image URL",
            because the menu's Copy link copies this page. Open is a link to
            the served image, in a new tab, the one place the image can be
            seen without the tool round it.
          -->
          <div class="tool-actions">
            <div class="button-group">
              <button type="button" class="button copy-btn" id="image-placeholder-copy" data-clipboard-target="#image-placeholder-url">
                <span class="copy-btn-default">{{icon:copy}}<span>Copy image URL</span></span>
                <span class="copy-btn-copied">{{icon:check}}<span>Copied!</span></span>
              </button>
              <a class="button" data-variant="outline" id="image-placeholder-open" href="/image/600x400" target="_blank" rel="noopener">{{icon:external-link}}<span>Open image<span class="visually-hidden"> (opens in a new tab)</span></span></a>
            </div>
          </div>
        </div>

      </div>
